name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names; Python 3.11 syntax)
        run: |
          python -m pip install ruff
          python -m ruff check --select E9,F63,F7,F82 --target-version py311 --exclude demo_data .
      - name: Tests
        run: python -m pytest tests extras/youtube/tests -q --ignore=tests/e2e
      - name: The demo library builds from a clean clone
        run: python demo/make_demo.py

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests (real Chromium against the demo server and the static build)
        run: python -m pytest tests/e2e -q

  windows-extras:
    name: Windows extras compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the C# extras
        shell: powershell
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $out = Join-Path $env:RUNNER_TEMP 'extras-build'
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($n in 'OpenFolderHandler','OpenVlcHandler') {
            & $csc /nologo /codepage:65001 /target:winexe "/out:$out\$n.exe" /reference:System.dll /reference:System.Core.dll "extras\windows\handlers\$n.cs"
            if ($LASTEXITCODE -ne 0) { throw "failed: $n" }
          }
          $refs = 'System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Web.Extensions.dll','Microsoft.VisualBasic.dll' | ForEach-Object { "/reference:$_" }
          & $csc /nologo /codepage:65001 /target:winexe "/out:$out\Vortex.exe" @refs "extras\vortex\Vortex.cs"
          if ($LASTEXITCODE -ne 0) { throw "failed: Vortex" }

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
